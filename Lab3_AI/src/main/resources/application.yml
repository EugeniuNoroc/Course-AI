server:
  port: 8080

# Параметры симуляции по умолчанию.
# Любой параметр можно поменять здесь, не трогая код,
# или прямо в браузере через панель параметров.
boids:
  # --- среда ---
  world-width: 100          # ширина плоскости, условные единицы
  world-height: 100         # высота плоскости
  boundary-mode: WRAP       # WRAP — вылет с противоположной стороны, BOUNCE — отражение от стенки

  # --- агенты ---
  boid-count: 50            # количество птиц
  max-speed: 1.0            # максимальная скорость, единиц за шаг
  min-speed: 0.3            # минимальная скорость (птица не может зависнуть в воздухе)
  max-acceleration: 0.1     # максимальное изменение скорости за один шаг
  seed: 42                  # зерно генератора случайных чисел (одинаковый seed = одинаковый старт)

  # --- правила Boids ---
  perception-radius: 10     # радиус взаимодействия: кого птица считает соседом
  separation-radius: 3      # радиус "личного пространства" для правила разделения
  cohesion-weight: 0.01     # вес центрирования
  alignment-weight: 0.05    # вес выравнивания
  separation-weight: 0.1    # вес разделения

  # --- метрики ---
  collision-distance: 1.0   # ближе этого расстояния считаем, что птицы столкнулись
  group-distance: 5.0       # птицы ближе этого расстояния (по цепочке) — одна группа
